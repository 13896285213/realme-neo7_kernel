name: Build Realme Neo7 Kernel

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU version'
        required: true
        default: 'r (ReSukiSU)'
        type: choice
        options:
          - 'r (ReSukiSU)'
          - 's (SukiSU)'
          - 'n (KernelSU-Next)'
          - 'k (Original KernelSU)'
      apply_susfs:
        description: 'Apply SUSFS patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      apply_lz4:
        description: 'Apply LZ4 compression patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      apply_net:
        description: 'Apply network enhancement patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      apply_ssg:
        description: 'Apply SSG patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      custom_suffix:
        description: 'Custom build suffix'
        required: false
        default: 'neo7-6.1.157'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KSU_BRANCH: ${{ github.event.inputs.ksu_branch || 'r (ReSukiSU)' }}
      APPLY_SUSFS: ${{ github.event.inputs.apply_susfs || 'y' }}
      APPLY_LZ4: ${{ github.event.inputs.apply_lz4 || 'y' }}
      APPLY_NET: ${{ github.event.inputs.apply_net || 'y' }}
      APPLY_SSG: ${{ github.event.inputs.apply_ssg || 'y' }}
      CUSTOM_SUFFIX: ${{ github.event.inputs.custom_suffix || 'neo7-6.1.157' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        run: |
          chmod +x local/builder.sh
          bash local/builder.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neo7-Kernel-${{ env.CUSTOM_SUFFIX }}
          path: kernel_workspace/*.zip
