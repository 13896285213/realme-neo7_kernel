name: Build Realme Neo7 Kernel

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU version'
        required: true
        default: 'r'
        type: choice
        options:
          - r (ReSukiSU)
          - s (SukiSU)
          - n (KernelSU-Next)
          - k (Original KernelSU)
      apply_susfs:
        description: 'Apply SUSFS patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      apply_lz4:
        description: 'Apply LZ4 compression patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      apply_net:
        description: 'Apply network enhancement patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      apply_ssg:
        description: 'Apply SSG patches'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      custom_suffix:
        description: 'Custom build suffix'
        required: false
        default: 'neo7-6.1.157'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_VERSION: "6.1.157"
      KSU_BRANCH: ${{ github.event.inputs.ksu_branch || 'r' }}
      APPLY_SUSFS: ${{ github.event.inputs.apply_susfs || 'y' }}
      APPLY_LZ4: ${{ github.event.inputs.apply_lz4 || 'y' }}
      APPLY_NET: ${{ github.event.inputs.apply_net || 'y' }}
      APPLY_SSG: ${{ github.event.inputs.apply_ssg || 'y' }}
      CUSTOM_SUFFIX: ${{ github.event.inputs.custom_suffix || 'neo7-6.1.157' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y binutils cmake cpp-12-arm-linux-gnueabi ccache curl git libc6-dev libcap-dev libcrypt-rijndael-perl libelf-dev libiberty-dev libssl-dev libtool perl python3 unzip wget bison flex zip
          sudo rm -f /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt update
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt-mark hold firefox libc-bin man-db

      - name: Prepare Cross-Compiler
        run: |
          sudo apt update
          sudo apt install -y clang-20 llvm-20
          cd /usr/bin
          sudo ln -s llvm-config-20 llvm-config
          sudo ln -s clang-20 clang
          sudo ln -s /usr/bin/llvm-ar-20 /usr/local/bin/llvm-ar
          sudo ln -s /usr/bin/llvm-nm-20 /usr/local/bin/llvm-nm
          sudo ln -s /usr/bin/llvm-ranlib-20 /usr/local/bin/llvm-ranlib
          sudo ln -s /usr/bin/llvm-strip-20 /usr/local/bin/llvm-strip

      - name: Build Kernel
        run: |
          chmod +x local/builder.sh
          bash local/builder.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neo7-Kernel-${{ env.KERNEL_VERSION }}-ksu-${{ env.KSU_BRANCH }}
          path: neo7-kernel-builder/kernel_workspace/*.zip
